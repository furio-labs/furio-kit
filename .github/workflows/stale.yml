name: Stale

on:
  schedule:
    - cron: '0 6 * * *'

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v10
        with:
          days-before-stale: 14
          days-before-close: 7
          stale-pr-label: stale
          stale-issue-label: stale
          # `dependencies` is a belt-and-braces guard: if the `needs-review`
          # labelling in dependabot-auto.yml ever fails, dependency PRs must
          # still not be silently closed. That failure mode discarded major
          # bumps unnoticed until 2026-07-25.
          exempt-pr-labels: keep-open,work-in-progress,needs-review,dependencies
          exempt-issue-labels: keep-open,work-in-progress
          stale-pr-message: >
            This PR has been inactive for 14 days and has been marked as stale.
            It will be closed in 7 days if there is no further activity.
            Remove the `stale` label or comment to keep it open.
          stale-issue-message: >
            This issue has been inactive for 14 days and has been marked as stale.
            It will be closed in 7 days if there is no further activity.
            Remove the `stale` label or comment to keep it open.
          close-pr-message: >
            This PR has been closed due to inactivity. Feel free to reopen it
            if you'd like to continue working on it.
          close-issue-message: >
            This issue has been closed due to inactivity. Feel free to reopen it
            if it's still relevant.
