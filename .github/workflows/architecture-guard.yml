name: Architecture Guard

on:
  pull_request:
    branches: [main]

jobs:
  architecture-guard:
    name: FSD Architecture Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── Import graph (dependency-cruiser, rules in .dependency-cruiser.cjs) ──
      # FSD layer direction, cross-slice imports, deep imports past a slice's
      # index.ts, @org/ui-kit and #ui-kit boundaries, server-only auth, cycles.
      # Works on the resolved graph: aliases, relative paths, dynamic import(),
      # export … from and type-only imports, across src/, app/ and root files.
      - name: Check import graph
        id: import-graph
        run: |
          set +e
          pnpm --silent check:arch --output-type err-long > /tmp/import-graph.txt 2>&1
          code=$?
          set -e
          cat /tmp/import-graph.txt
          if [ "$code" -eq 0 ]; then
            echo "status=pass" >> "$GITHUB_OUTPUT"
          else
            echo "status=fail" >> "$GITHUB_OUTPUT"
          fi

      # ── Barrel exports (every slice has an index.ts) ─────────────────────────
      - name: Check barrel exports
        id: barrels
        run: |
          set +e
          node scripts/check-barrels.mjs > /tmp/barrels.txt 2>&1
          code=$?
          set -e
          cat /tmp/barrels.txt
          if [ "$code" -eq 0 ]; then
            echo "status=pass" >> "$GITHUB_OUTPUT"
          else
            echo "status=fail" >> "$GITHUB_OUTPUT"
          fi

      # ── Post PR comment ─────────────────────────────────────────────────────
      - name: Post PR comment
        if: always()
        uses: actions/github-script@v9
        env:
          GRAPH_STATUS: ${{ steps.import-graph.outputs.status }}
          BARREL_STATUS: ${{ steps.barrels.outputs.status }}
        with:
          script: |
            const fs = require('fs');

            const graphStatus  = process.env.GRAPH_STATUS  || 'fail';
            const barrelStatus = process.env.BARREL_STATUS || 'fail';
            const icon = (s) => s === 'pass' ? '✅' : '❌';

            function read(path) {
              try {
                return fs.readFileSync(path, 'utf8').trim() || null;
              } catch {
                return null;
              }
            }

            // Keep the comment under GitHub's 65,536-character limit.
            function clip(text, max = 30000) {
              return text.length > max ? `${text.slice(0, max)}\n… (truncated; see the job log)` : text;
            }

            function section(title, status, output) {
              let out = `### ${icon(status)} ${title}\n`;
              if (status === 'fail' && output) {
                out += `\n\`\`\`\n${clip(output)}\n\`\`\`\n`;
              }
              return out;
            }

            const allPass = graphStatus === 'pass' && barrelStatus === 'pass';
            const summary = allPass
              ? '**All architecture checks passed.**'
              : '**One or more architecture checks failed. Please review the violations below.**';

            const body = [
              '## Architecture Guard',
              '',
              summary,
              '',
              section(
                'Import graph: FSD layers, slice isolation, public APIs, UI kit and server-only boundaries, cycles (`pnpm check:arch`)',
                graphStatus,
                read('/tmp/import-graph.txt'),
              ),
              section(
                'Barrel exports (`index.ts` required for every slice)',
                barrelStatus,
                read('/tmp/barrels.txt'),
              ),
            ].join('\n');

            // Find existing bot comment and update it, or create a new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(
              c => c.user.type === 'Bot' && c.body.includes('## Architecture Guard')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      # ── Fail the job if any check failed ────────────────────────────────────
      - name: Fail if violations found
        if: |
          steps.import-graph.outputs.status != 'pass' ||
          steps.barrels.outputs.status != 'pass'
        run: |
          echo "Architecture violations detected. See the PR comment or the step logs above."
          exit 1
