name: Dependabot Triage

# Flags major-version bumps for human review. It does not merge anything.
#
# Auto-merge was removed when `main` had no branch protection, so
# `gh pr merge --auto` had nothing to wait on. `main` is now covered by the
# `main-protection` ruleset (both CI matrix checks, one approving review), but
# auto-merge is still off: the repository has `allow_auto_merge` disabled, and
# the required review would block Dependabot PRs anyway.
#
# To restore auto-merge: enable `allow_auto_merge`, decide what supplies the
# required review for Dependabot PRs, then add the merge steps back.

on: pull_request

permissions:
  contents: read
  pull-requests: write

jobs:
  triage:
    name: Flag major bumps for review
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The `needs-review` label is also in stale.yml's `exempt-pr-labels`, so
      # labelling here is what keeps a major bump from being auto-closed at 21
      # days. If this step fails, major dependency PRs are silently discarded.
      - name: Label major updates for review
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: |
          gh pr edit "$PR_URL" --add-label "needs-review"
          gh pr comment "$PR_URL" --body "This is a **major version bump** (${{ steps.metadata.outputs.previous-version }} -> ${{ steps.metadata.outputs.new-version }}). Manual review required before merging."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
